<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Date El Gusto · POS Chile</title><style>body{margin:0;font-family:Arial;background:#f3f5f7;color:#17202a}header{background:#181818;color:#fff;padding:18px;font-size:22px;font-weight:900}header span{color:#ff4938}.toolbar{background:#fff;padding:10px;display:flex;gap:8px;overflow:auto;border-bottom:1px solid #ddd}button{padding:10px;border:1px solid #ddd;border-radius:8px;background:#fff;font-weight:700;cursor:pointer}.layout{display:grid;grid-template-columns:1fr 390px;gap:14px;padding:14px}.panel{background:#fff;border:1px solid #ddd;border-radius:12px}.panel h2{margin:0;padding:14px;border-bottom:1px solid #eee}.cats{display:flex;gap:8px;padding:12px;overflow:auto}.cats button.active{background:#d92d20;color:white}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:12px}.product{border:1px solid #ddd;border-radius:10px;padding:12px}.emoji{font-size:34px}.price{color:#d92d20;font-weight:900;margin-top:8px}.order{display:flex;flex-direction:column;min-height:600px}.head{padding:12px;display:flex;gap:8px;border-bottom:1px solid #eee}.head input,.head select{padding:10px;border:1px solid #ddd;border-radius:8px}.items{flex:1}.row{display:grid;grid-template-columns:1fr 70px 85px 25px;gap:5px;padding:10px;border-bottom:1px solid #eee;align-items:center}.qty{display:flex;gap:4px;align-items:center}.qty button{padding:3px 7px}.summary{padding:12px;border-top:1px solid #ddd}.line{display:flex;justify-content:space-between;padding:4px}.total{font-size:23px;font-weight:900}.checkout{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.pay{background:#159447;color:#fff}.empty{text-align:center;color:#777;padding:40px}.note{font-size:12px;color:#6b7280;line-height:1.4}@media(max-width:900px){.layout{grid-template-columns:1fr}}@media(max-width:500px){.row{grid-template-columns:1fr 62px 72px 20px}.products{grid-template-columns:1fr 1fr}}</style></head><body><header>DATE <span>EL GUSTO</span> · POS CHILE</header><nav class="toolbar"><button onclick="newSale()">🧾 Nueva venta</button><button onclick="alert('Módulo de clientes preparado')">👤 Cliente</button><button onclick="alert('Caja: apertura, movimientos, cierre y arqueo')">💰 Caja</button><button onclick="report()">📊 Reportes</button><button onclick="alert('Configura RUT, razón social, dirección y emisión DTE')">⚙ Configuración</button></nav><main class="layout"><section class="panel"><h2>🍔 Menú rápido</h2><div class="cats" id="cats"></div><div class="products" id="products"></div></section><section class="panel order"><h2>🛒 Pedido actual</h2><div class="head"><input id="customer" placeholder="Cliente / mesa / pedido" style="flex:1"><select id="type"><option>Para llevar</option><option>En local</option><option>Delivery</option></select></div><div class="items" id="items"></div><div class="summary"><div class="line"><span>Neto</span><b id="net">$0</b></div><div class="line"><span>IVA 19%</span><b id="iva">$0</b></div><div class="line"><span>Propina sugerida 10%</span><b id="tip">$0</b></div><div class="line total"><span>Total</span><b id="total">$0</b></div><div class="checkout"><button class="pay" onclick="pay()">COBRAR</button><button onclick="newSale()">LIMPIAR</button></div><p class="note">POS orientado a Chile. La emisión tributaria real requiere integración y configuración conforme al SII.</p></div></section></main><script>const P=[['Clásica','Hamburguesas',6490,'🍔'],['Doble Cheese','Hamburguesas',8990,'🍔'],['Bacon Burger','Hamburguesas',8490,'🥓'],['Pollo Crispy','Hamburguesas',7490,'🍗'],['Combo Clásico','Combos',8990,'🍔'],['Combo Doble','Combos',11490,'🍔'],['Papas Fritas','Papas',2990,'🍟'],['Papas Cheddar','Papas',4490,'🍟'],['Coca-Cola 500 ml','Bebidas',1990,'🥤'],['Sprite 500 ml','Bebidas',1990,'🥤'],['Agua mineral','Bebidas',1490,'💧'],['Extra queso','Extras',990,'🧀'],['Extra tocino','Extras',1490,'🥓']].map((x,i)=>({id:i,n:x[0],c:x[1],p:x[2],e:x[3]}));let cart=[],cat='Todos',sales=JSON.parse(localStorage.getItem('date_el_gusto_sales')||'[]');const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n);function render(){let cs=['Todos',...new Set(P.map(x=>x.c))];$('cats').innerHTML=cs.map(c=>'<button class="'+(c==cat?'active':'')+'" onclick="cat=\''+c+'\';render()">'+c+'</button>').join('');let ps=cat=='Todos'?P:P.filter(x=>x.c==cat);$('products').innerHTML=ps.map(x=>'<div class="product" onclick="add('+x.id+')"><div class="emoji">'+x.e+'</div><b>'+x.n+'</b><div class="price">'+money(x.p)+'</div></div>').join('');draw()}function add(id){let p=P.find(x=>x.id==id),x=cart.find(x=>x.id==id);x?x.q++:cart.push({...p,q:1});draw()}function ch(id,d){let x=cart.find(x=>x.id==id);x.q+=d;if(x.q<1)cart=cart.filter(y=>y.id!=id);draw()}function draw(){let gross=cart.reduce((s,x)=>s+x.p*x.q,0),net=Math.round(gross/1.19);$('items').innerHTML=cart.length?cart.map(x=>'<div class="row"><b>'+x.n+'</b><span class="qty"><button onclick="ch('+x.id+',-1)">−</button>'+x.q+'<button onclick="ch('+x.id+',1)">+</button></span><b>'+money(x.p*x.q)+'</b><button onclick="ch('+x.id+',-99)">×</button></div>').join(''):'<div class="empty">Agrega productos para comenzar.</div>';$('net').textContent=money(net);$('iva').textContent=money(gross-net);$('tip').textContent=money(Math.round(gross*.1));$('total').textContent=money(gross)}function newSale(){cart=[];$('customer').value='';draw()}function pay(){if(!cart.length)return alert('Agrega productos antes de cobrar.');let total=cart.reduce((s,x)=>s+x.p*x.q,0),m=prompt('Medio de pago: Efectivo / Débito / Crédito / Transferencia / Webpay');if(!m)return;sales.push({date:new Date().toISOString(),total,payment:m,customer:$('customer').value||'Consumidor final'});localStorage.setItem('date_el_gusto_sales',JSON.stringify(sales));alert('Venta registrada: '+money(total));newSale()}function report(){let d=new Date().toDateString(),s=sales.filter(x=>new Date(x.date).toDateString()==d);alert('Ventas del día: '+money(s.reduce((a,x)=>a+x.total,0))+'\nTransacciones: '+s.length)}render()</script></body></html>
